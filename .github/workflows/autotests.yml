name: autotests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autotests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write   # test summary check run
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start QuantReplay simulators (XETRA, FASTMATCH)
        working-directory: sim-run
        # The simulator container runs as uid 1000; the runner's checkout belongs to another uid,
        # so the mounted directory must be writable for it (logs, FIX store).
        run: |
          mkdir -p log files_store_path_common fastmatch/log fastmatch/files_store_path_common
          chmod -R a+rwX .
          docker compose up -d

      - name: Wait for simulators (XETRA REST 9050 / FIX 9051, FASTMATCH REST 9052 / FIX 9053)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9050/api/venues >/dev/null && nc -z localhost 9051 &&
              curl -sf http://localhost:9052/api/venues >/dev/null && nc -z localhost 9053 && exit 0
            sleep 5
          done
          docker compose -f sim-run/docker-compose.yml logs --tail=100
          exit 1

      - name: Run tests
        run: pytest --alluredir=allure-results --junitxml=junit.xml

      - name: Test summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: junit.xml
          detailed_summary: true
          include_passed: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload simulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs
          path: |
            sim-run/log
            sim-run/fastmatch/log

  report:
    # Publish the Allure report (with run history) to GitHub Pages for pushes to main.
    needs: tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get report history
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        run: |
          [ -d gh-pages/history ] && cp -r gh-pages/history allure-results/history || true
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
          JSON
          npx -y allure-commandline@2 generate allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
