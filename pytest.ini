[pytest]
testpaths = tests
pythonpath = .
# -n 2: one worker per venue (tests/conftest.py, VenueScheduling); -n 0 runs everything in one process
addopts = -ra --tb=short --import-mode=importlib --strict-markers -n 2
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(name)-6s %(message)s
log_date_format = %H:%M:%S
xfail_strict = true
markers =
    smoke: business-critical checks - core trading logic and anything that can lose money
    known_issue(description): documented defect; the test is expected to fail until it is fixed
    fix: FIX order and market data session
    rest: REST administration API
    db: simulator database
    orders: order entry (NewOrderSingle / Replace / Cancel)
    market_data: market data requests
    orders_and_market_data: order book changes seen through market data
    positive: valid requests, expected business flow
    negative: invalid requests, expected rejects
    boundary: limits of the instrument configuration (qty min/max/multiple, price tick)
    time_in_force: Day, GTC, GTD, IOC, FOK behaviour
rp_endpoint = http://127.0.0.1:8080
rp_project = quantreplay
rp_launch = QuantReplay autotests
rp_launch_attributes = venue:XETRA suite:regression
rp_launch_description = FIX (FIXT.1.1 / FIX 5.0 SP2), REST and DB checks against QuantReplay simulator
rp_log_level = INFO
rp_is_skipped_an_issue = False
