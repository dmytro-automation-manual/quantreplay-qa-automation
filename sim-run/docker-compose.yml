networks:
  market-simulator-net:
    driver: bridge

services:
  XETRA:
    image: ghcr.io/quod-financial/deploy_marketsim:latest
    platform: linux/amd64
    container_name: XETRA
    networks:
      - market-simulator-net
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - ./xetra/:/market-simulator/quod/data/
      - ./dictionaries/:/market-simulator/quod/data/cfg/default/:ro
    environment:
      - INSTANCE_ID=XETRA
      - PREFIX=QUOD
    depends_on:
      liquibase:
        condition: service_completed_successfully

  FASTMATCH:
    image: ghcr.io/quod-financial/deploy_marketsim:latest
    platform: linux/amd64
    container_name: FASTMATCH
    networks:
      - market-simulator-net
    ports:
      - "9052:9052"
      - "9053:9053"
    volumes:
      - ./fastmatch/:/market-simulator/quod/data/
      - ./dictionaries/:/market-simulator/quod/data/cfg/default/:ro
    environment:
      - INSTANCE_ID=FASTMATCH
      - PREFIX=QUOD
    depends_on:
      liquibase:
        condition: service_completed_successfully

  database:
    image: ghcr.io/quod-financial/postgres_marketsim:latest
    container_name: market-simulator-database
    networks:
      - market-simulator-net
    ports:
      - 15432:5432
    volumes:
      - ./db/simdb_test_data.sql:/docker-entrypoint-initdb.d/zz_simdb_test_data.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_DB=simdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=sim psql -h 127.0.0.1 -U sim -d simdb -tAc 'select count(*) from sim.listing' | grep -q '^[1-9]'" ]
      retries: 30
      interval: 2s
      timeout: 5s

  external_price-seed-db:
    image: postgres:18.6
    container_name: external_price-seed-db
    networks:
      - market-simulator-net
    ports:
      - 15433:5432
    volumes:
      - ./db/external_price_seed.sql:/docker-entrypoint-initdb.d/external_price_seed.sql:ro
    tmpfs:
      - /var/lib/postgresql
    environment:
      - POSTGRES_DB=priceseed
      - POSTGRES_USER=priceseed
      - POSTGRES_PASSWORD=priceseed
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=priceseed psql -h 127.0.0.1 -U priceseed -d priceseed -tAc 'select count(*) from price_seed' | grep -q '^[1-9]'" ]
      retries: 30
      interval: 2s
      timeout: 5s

  liquibase:
    image: ghcr.io/quod-financial/liquibase:latest
    container_name: market-simulator-liquibase
    networks:
      - market-simulator-net
    depends_on:
      database:
        condition: service_healthy
