networks:
  market-simulator-net:
    driver: bridge

services:
  XETRA:
    image: ghcr.io/quod-financial/deploy_marketsim:latest
    platform: linux/amd64
    container_name: XETRA
    networks:
      - market-simulator-net
    ports:
      - "9050:9050" # Port to send REST API requests
      - "9051:9051" # Port to send FIX messages
    volumes:
      - ./:/market-simulator/quod/data/
    environment:
      - INSTANCE_ID=XETRA
      - PREFIX=QUOD
    depends_on:
      liquibase:
        condition: service_completed_successfully

  database:
    image: ghcr.io/quod-financial/postgres_marketsim:latest
    container_name: market-simulator-database
    networks:
      - market-simulator-net
    ports:
      - 15432:5432
    volumes:
      # Test database kept on the host (in git): loaded on every start, after the image's init.sql
      # that creates the `sim` user and schema. Rebuild it with scripts/build_test_db.sh.
      - ./db/simdb_test_data.sql:/docker-entrypoint-initdb.d/zz_simdb_test_data.sql:ro
    # Data lives in memory: every (re)start of the container begins from the test database above,
    # so a test run can never leave anything behind for the next one.
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      - POSTGRES_DB=simdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      # Over TCP and as the application user: true only after the init scripts have loaded the test data
      # (during init Postgres listens on the unix socket only).
      test: [ "CMD-SHELL", "PGPASSWORD=sim psql -h 127.0.0.1 -U sim -d simdb -tAc 'select count(*) from sim.listing' | grep -q '^[1-9]'" ]
      retries: 30
      interval: 2s
      timeout: 5s

  liquibase:
    image: ghcr.io/quod-financial/liquibase:latest
    container_name: market-simulator-liquibase
    networks:
      - market-simulator-net
    depends_on:
      database:
        condition: service_healthy
